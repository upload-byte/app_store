<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Saver</title>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 20px auto;
      padding: 0 20px;
      background-color: #f4f6f8;
      color: #333;
    }

    h1, h2 {
      color: #2c3e50;
    }

    .editor-section {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-family: inherit;
    }

    textarea {
      font-family: monospace;
      resize: vertical;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-primary { background-color: #007bff; color: white; }
    .btn-secondary { background-color: #6c757d; color: white; }
    .btn-danger { background-color: #dc3545; color: white; }
    .btn-edit { background-color: #ffc107; color: #212529; }

    .btn:hover { opacity: 0.9; }

    /* Saved Notes Cards */
    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .note-card {
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
      border-left: 5px solid #007bff;
    }

    .note-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .note-title {
      margin: 0;
      font-size: 1.2rem;
    }

    .note-date {
      font-size: 0.85rem;
      color: #777;
    }

    .note-content {
      white-space: pre-wrap; /* Preserves line breaks */
      font-family: monospace;
      background: #f9f9f9;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    .note-actions {
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>

  <h1>Personal Saver</h1>

  <!-- Editor Section -->
  <div class="editor-section">
    <input type="text" id="note-title" placeholder="Note Title...">
    <textarea id="note-content" rows="10" placeholder="Type your notes here..."></textarea>
    
    <button id="save-btn" class="btn btn-primary" onclick="saveNote()">Save Note</button>
    <button id="cancel-btn" class="btn btn-secondary" onclick="cancelEdit()" style="display: none;">Cancel</button>
  </div>

  <!-- Saved Notes Display -->
  <h2>Saved Notes</h2>
  <div id="notes-container" class="notes-list"></div>

  <script>
    // Store array of notes in local storage as a JSON string
    let notes = JSON.parse(localStorage.getItem('saved_notes')) || [];
    let editingNoteId = null;

    const titleInput = document.getElementById('note-title');
    const contentInput = document.getElementById('note-content');
    const saveBtn = document.getElementById('save-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const notesContainer = document.getElementById('notes-container');

    // Initial render when the page loads
    renderNotes();

    // Render all notes to the screen
    function renderNotes() {
      notesContainer.innerHTML = '';

      if (notes.length === 0) {
        notesContainer.innerHTML = '<p>No saved notes yet.</p>';
        return;
      }

      notes.forEach(note => {
        const card = document.createElement('div');
        card.className = 'note-card';

        card.innerHTML = `
          <div class="note-header">
            <h3 class="note-title">${escapeHtml(note.title || 'Untitled Note')}</h3>
            <span class="note-date">${note.date}</span>
          </div>
          <div class="note-content">${escapeHtml(note.content)}</div>
          <div class="note-actions">
            <button class="btn btn-edit" onclick="editNote(${note.id})">Edit</button>
            <button class="btn btn-danger" onclick="deleteNote(${note.id})">Delete</button>
          </div>
        `;

        notesContainer.appendChild(card);
      });
    }

    // Save a new note or update an existing one
    function saveNote() {
      const title = titleInput.value.trim();
      const content = contentInput.value.trim();

      if (!title && !content) {
        alert('Please add a title or content before saving.');
        return;
      }

      const currentDate = new Date().toLocaleString();

      if (editingNoteId !== null) {
        // Edit existing note
        notes = notes.map(note => {
          if (note.id === editingNoteId) {
            return { ...note, title, content, date: `Updated: ${currentDate}` };
          }
          return note;
        });
        editingNoteId = null;
        saveBtn.textContent = 'Save Note';
        cancelBtn.style.display = 'none';
      } else {
        // Create new note object
        const newNote = {
          id: Date.now(), // Unique identifier
          title,
          content,
          date: currentDate
        };
        notes.unshift(newNote); // Add to top of list
      }

      persistAndRefresh();
      clearInputs();
    }

    // Populate editor with selected note's data for editing
    function editNote(id) {
      const noteToEdit = notes.find(note => note.id === id);
      if (!noteToEdit) return;

      titleInput.value = noteToEdit.title;
      contentInput.value = noteToEdit.content;
      editingNoteId = id;

      saveBtn.textContent = 'Update Note';
      cancelBtn.style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Cancel edit mode
    function cancelEdit() {
      editingNoteId = null;
      saveBtn.textContent = 'Save Note';
      cancelBtn.style.display = 'none';
      clearInputs();
    }

    // Delete a note by ID
    function deleteNote(id) {
      if (confirm('Are you sure you want to delete this note?')) {
        notes = notes.filter(note => note.id !== id);

        // Reset editor if currently editing the deleted note
        if (editingNoteId === id) {
          cancelEdit();
        }

        persistAndRefresh();
      }
    }

    // Save to LocalStorage and update UI
    function persistAndRefresh() {
      localStorage.setItem('saved_notes', JSON.stringify(notes));
      renderNotes();
    }

    // Clear form inputs
    function clearInputs() {
      titleInput.value = '';
      contentInput.value = '';
    }

    // Utility function to prevent HTML injection attacks (XSS)
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.innerText = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
